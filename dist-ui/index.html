y, or embed it in the payload."},{file:"src/core/auth-service.ts",line:165,side:"RIGHT",severity:"WARN",body:"`loadUserDb` reads and parses `users.json` from disk on every call. With concurrent requests this creates redundant I/O. Consider a short-lived in-memory cache or move to a proper database."},{file:"src/core/auth-service.ts",line:235,side:"RIGHT",severity:"INFO",body:"`Math.random()` was correctly replaced with `crypto.randomBytes` for the reset token. One small follow-up: log a warning (not an error) when a reset is attempted for an unknown email — currently the error propagates to the caller and leaks whether the account exists."},{file:"src/core/auth-service.ts",line:71,side:"RIGHT",severity:"INFO",body:"Consider extracting the token generation and storage into a dedicated `createSession` method — it's called from `login` today but will likely be needed for OAuth and SSO flows too."},{file:"src/core/token-store.ts",line:12,side:"RIGHT",severity:"WARN",body:"⚠ ORPHAN: this file is not in the diff — comment is counted but never rendered, blocking the Finish button."}]},diff:Ky()+Xy()+`diff --git a/src/core/output.ts b/src/core/output.ts
