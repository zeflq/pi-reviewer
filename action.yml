name: "pi-reviewer"
description: "AI-powered PR reviewer using the pi agent — model-agnostic"
author: "zeflq"

inputs:
  github-token:
    description: "GitHub token to post PR comments."
    required: true

  pi-api-key:
    description: "Pi platform API key"
    required: true

  model:
    description: "Model to use in provider/modelId format (e.g. anthropic/claude-opus-4-6)"
    required: false

  post-comment:
    description: "Post review as a GitHub PR comment"
    required: false
    default: "true"

  min-severity:
    description: "Minimum severity level to report: info, warn, or critical (default: info)"
    required: false
    default: "info"

  setup-node:
    description: "Set up Node via actions/setup-node. Set to false if the runner image already provides Node."
    required: false
    default: "true"

  install-deps:
    description: "Install the action's Node deps via pnpm. Set to false if @earendil-works/* is already resolvable from the action path (e.g. vendored or symlinked into action_path/node_modules)."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      if: ${{ inputs.install-deps == 'true' }}
      uses: pnpm/action-setup@v4
      with:
        version: 11.5.2
        run_install: false

    - name: Setup Node
      if: ${{ inputs.setup-node == 'true' }}
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: ${{ inputs.install-deps == 'true' && 'pnpm' || '' }}
        cache-dependency-path: ${{ github.action_path }}/pnpm-lock.yaml

    - name: Install dependencies
      if: ${{ inputs.install-deps == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile
      working-directory: ${{ github.action_path }}

    - name: Run review
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PI_API_KEY: ${{ inputs.pi-api-key }}
        POST_COMMENT: ${{ inputs.post-comment }}
        PI_REVIEWER_MODEL: ${{ inputs.model }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
      run: node ${{ github.action_path }}/dist/src/ci/action-entry.js

branding:
  icon: "eye"
  color: "blue"
